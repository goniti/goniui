name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC) + provenance

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm >= 11.5.1: no npm token is stored.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      # Opens a "Version packages" PR from the pending changesets; once merged, publishes.
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm authenticates the workflow itself (trusted publisher configured on
          # npmjs.com for goniti/goniui · release.yml) and adds the provenance.
          NPM_CONFIG_PROVENANCE: true
